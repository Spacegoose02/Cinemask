services:
  cinemask:
    image: ghcr.io/spacegoose02/cinemask:latest
    build: .
    container_name: cinemask
    restart: unless-stopped
    ports:
      - "7979:7979"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      # Set to true only when behind a reverse proxy (Nginx Proxy Manager, SWAG, Traefik, Caddy).
      - TRUST_PROXY=false
    volumes:
      - ./config:/config
      # Put downloads and media on the same disk/share so imports can hardlink.
      - /mnt/user/data/downloads:/downloads
      - /mnt/user/data/media:/media
